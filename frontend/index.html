<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>RFP Agent - Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; }
    #chat { border: 1px solid #ddd; padding: 1rem; min-height: 300px; }
    .msg { margin-bottom: 1rem; }
    .user { color: #0b6; }
    .assistant { color: #06f; }
  </style>
</head>
<body>
  <h1>RFP Agent (Demo)</h1>

  <section>
    <h3>Upload RFP text file</h3>
    <form id="uploadForm">
      <input type="file" name="file" accept=".txt" required />
      <input type="text" name="title" placeholder="Document title (optional)" />
      <button type="submit">Upload</button>
    </form>
    <div id="uploadResult"></div>
  </section>

  <section>
    <h3>Chat</h3>
    <div id="chat"></div>
    <input id="question" placeholder="Ask about the RFP..." style="width:70%" />
    <button id="askBtn">Ask</button>
  </section>

  <script>
    let sessionId = localStorage.getItem('rfp_session') || null;
    const chatEl = document.getElementById('chat');
    function append(role, text) {
      const d = document.createElement('div');
      d.className = 'msg ' + (role==='user' ? 'user' : 'assistant');
      d.textContent = (role==='user' ? 'You: ' : 'Agent: ') + text;
      chatEl.appendChild(d);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target.file.files[0];
      if (!f) return;
      const form = new FormData();
      form.append('file', f);
      form.append('title', e.target.title.value || f.name);
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      const j = await res.json();
      document.getElementById('uploadResult').textContent = j.ok ? 'Uploaded docId: ' + j.docId : 'Upload error';
    });

    document.getElementById('askBtn').addEventListener('click', async () => {
      const q = document.getElementById('question').value.trim();
      if (!q) return;
      append('user', q);
      document.getElementById('question').value = '';
      const payload = { sessionId, question: q };
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const j = await res.json();
      if (j.ok) {
        sessionId = j.sessionId;
        localStorage.setItem('rfp_session', sessionId);
        append('assistant', j.reply);
      } else {
        append('assistant', 'Error: ' + j.error);
      }
    });
  </script>
</body>
</html>
