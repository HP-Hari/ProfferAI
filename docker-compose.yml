version: "3.8"
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rfp_db
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    command: celery -A app.tasks.celery worker --loglevel=info
    depends_on:
      - backend
      - redis
volumes:
  db-data:
